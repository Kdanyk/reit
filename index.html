<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C-RET Minimal by @danyk</title>
  <style>
    :root{
        --bg:#030712;
        --card:#111827;
        --border:rgba(255,255,255,.08);
        --green:#22c55e;
        --green2:#86efac;
        --blue:#3b82f6;
        --blue2:#93c5fd;
        --text:#ffffff;
        --muted:#cbd5e1;
    }

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        min-height:100vh;
        color:var(--text);
        font-family:Inter,Segoe UI,sans-serif;
        background:
            radial-gradient(circle at 15% 20%,rgba(34,197,94,.20),transparent 30%),
            radial-gradient(circle at 85% 80%,rgba(59,130,246,.18),transparent 30%),
            linear-gradient(135deg,#020617,#0f172a,#111827);
    }

    .layout{
        display:flex;
        min-height:100vh;
    }

    .left{
        width:50%;
        padding:35px 70px;
        display:flex;
        flex-direction:column;
    }

    .right{
        width:50%;
        display:flex;
        justify-content:center;
        align-items:flex-start;
        border-left:1px solid var(--border);
        overflow-y:auto;
        max-height:100vh;
    }

    .right::-webkit-scrollbar { width: 8px; }
    .right::-webkit-scrollbar-track { background: transparent; }
    .right::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    .right::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    .author-bar{
        display:flex;
        align-items:center;
        gap:20px;
    }

    .author{
        color:var(--green2);
        font-weight:900;
        letter-spacing:3px;
        text-transform:uppercase;
    }

    .author-buttons{
        display:flex;
        gap:12px;
    }

    .mini-btn{
        width:52px;
        height:52px;
        border-radius:50%;
        border:2px solid rgba(255,255,255,.15);
        background:rgba(255,255,255,.03);
        backdrop-filter:blur(10px);
        cursor:pointer;
        transition:.25s;
    }

    .mini-btn:hover{
        border-color:var(--green);
        box-shadow:0 0 25px rgba(34,197,94,.4);
        transform:translateY(-2px);
    }

    .logo{
        margin-top:40px;
        font-size:90px;
        font-weight:900;
        color:var(--green);
        text-shadow:0 0 50px rgba(34,197,94,.4);
        letter-spacing: -2px;
    }

    .buttons-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-top: 35px;
    }

    .install{
        display:inline-flex;
        justify-content:center;
        align-items:center;
        padding:22px 40px;
        border-radius:22px;
        text-decoration:none;
        font-size:32px;
        font-weight:900;
        color:#02120a;
        background:linear-gradient(135deg,var(--green),var(--green2));
        box-shadow:0 15px 40px rgba(34,197,94,.35);
        transition:.25s;
        cursor:pointer;
        user-select:none;
        width: fit-content;
    }

    .install.bookmarklet {
        background:linear-gradient(135deg,var(--blue),var(--blue2));
        box-shadow:0 15px 40px rgba(59,130,246,.35);
        color:#020617;
        font-size: 24px;
        padding: 18px 35px;
    }

    .install:active{
        transform: scale(0.98);
    }

    .install:hover{
        transform:translateY(-4px) scale(1.02);
        box-shadow:0 25px 60px rgba(34,197,94,.45);
    }

    .install.bookmarklet:hover{
        box-shadow:0 25px 60px rgba(59,130,246,.45);
    }

    .copy-code-mini {
        padding: 8px 16px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        width: fit-content;
    }

    .copy-code-mini:hover {
        background: rgba(34, 197, 94, 0.1);
        color: var(--green);
        border-color: var(--green);
    }

    .description{
        margin-top:25px;
        color:var(--muted);
        font-size:18px;
        line-height:1.8;
    }

    .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 25px;
    }

    .small-btn {
        border: 1px solid var(--border);
        background: rgba(255,255,255,.05);
        color: var(--text);
        border-radius: 16px;
        padding: 13px 20px;
        cursor: pointer;
        font-weight: 700;
        font-size: 16px;
        transition: .25s;
    }

    .small-btn:hover {
        transform: translateY(-2px);
        background: rgba(34,197,94,.1);
        border-color: var(--green);
    }

    .status {
        margin-top: 16px;
        min-height: 26px;
        color: var(--green2);
        font-weight: 700;
        font-size: 14px;
    }

    .card{
        margin-top:35px;
        padding:28px;
        border-radius:24px;
        background:rgba(255,255,255,.04);
        border:1px solid var(--border);
        backdrop-filter:blur(20px);
        margin-bottom: 35px;
    }

    .card h2{
        margin-bottom:15px;
        font-size:32px;
    }

    .card ul{
        margin-left:20px;
    }

    .card li{
        margin-bottom:12px;
        color:var(--muted);
    }

    .gallery{
        width:90%;
        column-count:2;
        column-gap:18px;
        padding:30px;
    }

    .gallery img{
        width:100%;
        height:auto;
        display:block;
        margin-bottom:18px;
        border-radius:20px;
        break-inside:avoid;
        border:1px solid rgba(255,255,255,.08);
        box-shadow:0 10px 30px rgba(0,0,0,.3);
        transition:.3s;
        cursor:pointer;
    }

    .gallery img:hover{
        transform:scale(1.03);
        border-color:var(--green);
        box-shadow:0 0 35px rgba(34,197,94,.35);
    }

    @media(max-width:1000px){
        .layout{ flex-direction:column; }
        .left, .right{ width:100%; border-left:none; }
        .right{ overflow-y:visible; max-height:none; }
        .left{ padding:25px 20px; }
        .logo{ font-size:60px; }
        .install{ font-size:24px; width:100%; padding:20px; }
        .install.bookmarklet { font-size: 20px; width: 100%; }
        .gallery{ column-count:1; width:100%; padding:20px; }
    }
  </style>
</head>

(() => {
  'use strict';

  if (window.cRetMinimalV5) return;
  window.cRetMinimalV5 = true;
  document.querySelectorAll('[data-reit-counter]').forEach((el) => el.remove());

  const saveKey = 'cRetMinimalStateV5';
  const technoFont = 'Consolas,"Lucida Console","Courier New",monospace';
  
  const dayHours = ['6:30', '7:30', '8:30', '9:30', '10:30', '11:30', '12:30', '13:30', '14:30', '15:30', '16:30'];
  const nightHours = ['18:30', '19:30', '20:30', '21:30', '22:30', '23:30', '0:30', '1:30', '2:30', '3:30', '4:30'];
  
  const currentHour = new Date().getHours();
  const night = currentHour >= 17 || currentHour < 6;
  const hours = night ? nightHours : dayHours;
  const shiftName = night ? 'night' : 'day';

  let total = 0;
  let seen = '';
  let start = Date.now();
  let hourCounts = {};
  
  let targetPerHour = 44;
  let showPercentage = false;
  let idleOpacity = 0.01;
  let accentColor = '#35d66b';
  
  const triggerText = 'Przedmiot jest kompletny';
  let tableOpen = false;
  let settingsOpen = false;

  function initCounts() {
    hours.forEach((h) => { hourCounts[h] = 0; });
    start = Date.now();
    total = 0;
  }

  function loadState() {
    try {
      const s = JSON.parse(localStorage.getItem(saveKey) || '{}');
      if (s.shift !== shiftName) { initCounts(); return; }
      start = Number(s.start) || Date.now();
      targetPerHour = Math.max(1, parseInt(s.targetPerHour) || 44);
      showPercentage = !!s.showPercentage;
      idleOpacity = s.idleOpacity !== undefined ? parseFloat(s.idleOpacity) : 0.01;
      accentColor = s.accentColor || '#35d66b';
      hourCounts = {};
      hours.forEach((h) => { hourCounts[h] = Math.max(0, parseInt(s.hourCounts && s.hourCounts[h]) || 0); });
    } catch (_) { initCounts(); }
  }

  function saveState() {
    localStorage.setItem(saveKey, JSON.stringify({
      shift: shiftName, start, targetPerHour, showPercentage, idleOpacity, accentColor, hourCounts
    }));
  }

  loadState();

  function getSlot() {
    const d = new Date();
    let mins = d.getHours() * 60 + d.getMinutes();
    let slots = hours.map(h => { let a = h.split(':'); return +a[0] * 60 + +a[1]; });
    if (night && mins < 360) mins += 1440;
    if (night) slots = slots.map(x => x < 360 ? x + 1440 : x);
    for (let i = 0; i < slots.length; i++) { if (mins <= slots[i]) return hours[i]; }
    return hours[hours.length - 1];
  }

  function calcTotal() { total = hours.reduce((acc, h) => acc + (hourCounts[h] || 0), 0); }
  function getRate() { const h = Math.max(0, (Date.now() - start) / 3600000); return h > 0 ? (total / h) : 0; }

  function addPacks(n) {
    if (n === 0) return;
    const slot = getSlot();
    hourCounts[slot] = Math.max(0, (hourCounts[slot] || 0) + n);
    calcTotal(); saveState(); render();
    if (tableOpen) renderFullTable();
  }

  const uiContainer = document.createElement('div');
  uiContainer.setAttribute('data-reit-counter', 'true');
  
  const widgetWrapper = document.createElement('div');
  widgetWrapper.style = \`position: fixed; left: 20px; top: 30%; display: flex; flex-direction: row; align-items: flex-start; z-index: 999999; opacity: \${idleOpacity}; transition: opacity 0.4s ease; pointer-events: auto;\`;
  uiContainer.appendChild(widgetWrapper);

  const widget = document.createElement('div');
  widget.style = \`width: 170px; min-height: 120px; background: rgba(25, 25, 28, 0.95); color: #fff; font-family: \${technoFont}; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; cursor: move;\`;

  widgetWrapper.appendChild(widget);

  const tablePanel = document.createElement('div');
  tablePanel.style = \`width: 0px; margin-left: 0px; background: rgba(25, 25, 28, 0.95); color: #fff; font-family: \${technoFont}; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; transition: all 0.3s ease; border: 0px solid rgba(255,255,255,0.1);\`;
  tablePanel.innerHTML = \`<div id="table-content" style="width: 230px; padding: 15px;"></div>\`;
  widgetWrapper.appendChild(tablePanel);

  const settingsPanel = document.createElement('div');
  settingsPanel.style = \`width: 0px; margin-left: 0px; background: #fff; color: #111; font-family: \${technoFont}; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; transition: all 0.3s ease; border: 0px solid #ccc;\`;
  settingsPanel.innerHTML = \`<div style="width: 250px; padding: 15px;"><div style="font-size: 16px; font-weight: 900; margin-bottom: 12px; text-align: center;">USTAWIENIA</div><div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;"><div><label style="display: block; font-size: 11px; font-weight: bold; margin-bottom: 3px;">Cel (szt/h)</label><input id="set-target" type="number" value="\${targetPerHour}" style="width: 100%; padding: 6px; border: 1px solid #aaa; border-radius: 6px; box-sizing: border-box; font-family: \${technoFont}; font-weight: bold;"></div><div><label style="display: block; font-size: 11px; font-weight: bold; margin-bottom: 3px;">Kolor sukcesu</label><input id="set-color" type="color" value="\${accentColor}" style="width: 100%; height: 28px; border: none; border-radius: 6px; cursor: pointer; padding: 0;"></div></div><label style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: bold; margin-bottom: 15px; cursor: pointer;">Pokaż tempo w %<input id="set-percent" type="checkbox" style="width: 16px; height: 16px;" \${showPercentage ? 'checked' : ''}></label><label style="display: block; font-size: 11px; font-weight: bold; margin-bottom: 5px;">Przezroczystość w spoczynku</label><input id="set-opacity" type="range" min="0.01" max="0.8" step="0.05" value="\${idleOpacity}" style="width: 100%; margin-bottom: 15px;"><button id="btn-break" style="width: 100%; padding: 8px; background: #f39c12; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 15px;">☕ Przerwa 30 min (pauza tempa)</button><div style="display: flex; gap: 10px; margin-bottom: 15px;"><button id="btn-minus" style="flex: 1; padding: 8px; background: #ff4d4d; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">-1 Sztuka</button><button id="btn-plus" style="flex: 1; padding: 8px; background: #35d66b; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">+1 Sztuka</button></div><button id="btn-reset" style="width: 100%; padding: 8px; background: #555; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 10px;">🔄 Resetuj zmianę</button><button id="set-close" style="width: 100%; padding: 8px; background: #111; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-family: \${technoFont}; font-weight: bold;">ZAMKNIJ</button></div>\`;
  widgetWrapper.appendChild(settingsPanel);
  document.body.appendChild(uiContainer);

  function updatePanels() {
    tablePanel.style.width = tableOpen ? '260px' : '0px';
    tablePanel.style.marginLeft = tableOpen ? '10px' : '0px';
    tablePanel.style.borderWidth = tableOpen ? '1px' : '0px';
    settingsPanel.style.width = settingsOpen ? '280px' : '0px';
    settingsPanel.style.marginLeft = settingsOpen ? '10px' : '0px';
    settingsPanel.style.borderWidth = settingsOpen ? '1px' : '0px';
  }

  widget.querySelector('#w-hour-row').addEventListener('click', (e) => {
    e.stopPropagation();
    tableOpen = !tableOpen;
    if (tableOpen) { settingsOpen = false; renderFullTable(); }
    updatePanels();
  });

  function renderFullTable() {
    let html = \`<div style="text-align: center; font-size: 15px; font-weight: bold; margin-bottom: 12px;">Statystyki dzienne</div>\`;
    const curSlot = getSlot();
    hours.forEach(h => {
      const val = hourCounts[h] || 0;
      const isCurrent = h === curSlot;
      const good = val >= targetPerHour;
      const pct = Math.min(100, Math.round((val / targetPerHour) * 100));
      const color = good ? accentColor : '#3daee9';
      const bg = isCurrent ? 'rgba(255,255,255,0.1)' : 'transparent';
      html += \`<div style="background: \${bg}; padding: 6px; border-radius: 6px; margin-bottom: 4px;"><div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px;"><span style="color: \${isCurrent ? '#fff' : '#aaa'}; font-weight: \${isCurrent ? 'bold' : 'normal'}">\${h}</span><span style="font-weight: bold;">\${val} / \${targetPerHour}</span></div><div style="height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden;"><div style="height: 100%; width: \${pct}%; background: \${color}; border-radius: 2px;"></div></div></div>\`;
    });
    tablePanel.querySelector('#table-content').innerHTML = html;
  }

  let fadeTimer, secondaryFadeTimer;
  function startFadeOutSequence() {
    widgetWrapper.style.opacity = '0.5';
    secondaryFadeTimer = setTimeout(() => { widgetWrapper.style.opacity = idleOpacity; }, 3000);
  }
  widgetWrapper.addEventListener('mouseenter', () => {
    clearTimeout(fadeTimer); clearTimeout(secondaryFadeTimer); widgetWrapper.style.opacity = '1';
  });
  widgetWrapper.addEventListener('mouseleave', startFadeOutSequence);

  let isDragging = false, dx = 0, dy = 0;
  widgetWrapper.addEventListener('mousedown', (e) => {
    if (e.target.closest('button, input, #w-hour-row, #table-content, label')) return;
    isDragging = true;
    const rect = widgetWrapper.getBoundingClientRect();
    dx = e.clientX - rect.left; dy = e.clientY - rect.top;
    widgetWrapper.style.transition = 'none';
  });
  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    widgetWrapper.style.left = (e.clientX - dx) + 'px';
    widgetWrapper.style.top = (e.clientY - dy) + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (isDragging) { isDragging = false; widgetWrapper.style.transition = 'opacity 0.4s ease'; }
  });

  document.addEventListener('keydown', (e) => {
    if (e.shiftKey && e.key.toLowerCase() === 'z') {
      e.preventDefault(); settingsOpen = !settingsOpen; if (settingsOpen) tableOpen = false; updatePanels();
    }
    if (e.shiftKey && e.key.toLowerCase() === 'x') {
      e.preventDefault(); clearTimeout(fadeTimer); clearTimeout(secondaryFadeTimer);
      widgetWrapper.style.opacity = '1'; fadeTimer = setTimeout(startFadeOutSequence, 5000);
    }
  });

  settingsPanel.querySelector('#set-close').onclick = () => { settingsOpen = false; updatePanels(); };
  settingsPanel.querySelector('#set-target').oninput = (e) => { targetPerHour = parseInt(e.target.value) || 44; saveState(); render(); if(tableOpen) renderFullTable(); };
  settingsPanel.querySelector('#set-percent').onchange = (e) => { showPercentage = e.target.checked; saveState(); render(); };
  settingsPanel.querySelector('#set-opacity').oninput = (e) => { idleOpacity = parseFloat(e.target.value); widgetWrapper.style.opacity = idleOpacity; saveState(); };
  settingsPanel.querySelector('#set-color').oninput = (e) => { accentColor = e.target.value; saveState(); render(); if(tableOpen) renderFullTable(); };
  settingsPanel.querySelector('#btn-break').onclick = () => {
    start += 30 * 60 * 1000; saveState(); render();
    const btn = settingsPanel.querySelector('#btn-break');
    const oldText = btn.innerHTML;
    btn.innerHTML = '✔ Zastosowano (-30m)'; btn.style.background = '#27ae60';
    setTimeout(() => { btn.innerHTML = oldText; btn.style.background = '#f39c12'; }, 2000);
  };
  settingsPanel.querySelector('#btn-plus').onclick = () => addPacks(1);
  settingsPanel.querySelector('#btn-minus').onclick = () => addPacks(-1);
  settingsPanel.querySelector('#btn-reset').onclick = () => {
    if(confirm("Czy na pewno chcesz zresetować statystyki zmiany?")) { initCounts(); saveState(); render(); if (tableOpen) renderFullTable(); }
  };

  function esc(s) { return s.replace(/[.*+?^\${}()|[\\]\\\\]/g, '\\\\$&'); }
  function cnt(txt, what) { return (txt.match(new RegExp(esc(what), 'gi')) || []).length; }

  function render() {
    calcTotal();
    const rate = getRate();
    const curSlot = getSlot();
    const slotPacks = hourCounts[curSlot] || 0;
    
    document.getElementById('w-packs').textContent = total;
    if (showPercentage) {
      const pctRate = targetPerHour > 0 ? (rate / targetPerHour) * 100 : 0;
      document.getElementById('w-rate').textContent = pctRate.toFixed(0) + '%';
    } else { document.getElementById('w-rate').textContent = rate.toFixed(2) + '/h'; }
    
    const pct = Math.min(100, Math.round((slotPacks / targetPerHour) * 100));
    const good = slotPacks >= targetPerHour;
    
    document.getElementById('w-hour-row').innerHTML = \`<div style="display: flex; justify-content: space-between; margin-bottom: 6px; font-weight: bold;"><span style="color: #ccc;">\${curSlot}</span><span>\${slotPacks} <span style="color:#777; font-size: 11px;">/ \${targetPerHour}</span></span></div><div style="height: 6px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden;"><div style="height: 100%; width: \${pct}%; background: \${good ? accentColor : '#3daee9'}; border-radius: 4px; transition: width 0.3s, background 0.3s;"></div></div>\`;
  }

  function scan() {
    const txt = document.body.innerText || '';
    const currentMatches = cnt(txt, triggerText);
    const previousMatches = cnt(seen, triggerText);
    if (currentMatches > previousMatches) { addPacks(currentMatches - previousMatches); }
    seen = txt;
  }

  setInterval(scan, 1000);
  setInterval(render, 1000);
  window.addEventListener('beforeunload', saveState);
  render();
})();`;

    async function copyNewScript() {
      const status = document.getElementById('status');
      try {
        await navigator.clipboard.writeText(TAMPERMONKEY_CODE);
        status.innerHTML = '✅ Код скопійовано! Створи файл <code>c-ret.user.js</code> на GitHub і встав його туди.';
      } catch (e) {
        status.innerHTML = '❌ Не вдалося скопіювати автоматично.';
      }
    }

    function showHelp() {
      alert('Інструкція:\n\n[Для Tampermonkey]\n1. Натисни "📋 Скопіювати код для GitHub".\n2. Натисни на іконку Tampermonkey у браузері -> "Створити новий скрипт".\n3. Встав скопійований код -> Збережи (Ctrl+S).\n4. Відкрий свою робочу систему, натисни Shift+X.\n\n[Для Закладки]\n1. Натисни Ctrl+Shift+B, щоб відкрити панель закладок браузера.\n2. Перетягни синю кнопку "🔖 BOOKMARKLET" на панель.\n3. Перейди на робочу сторінку і натисни створену закладку.');
    }
  </script>
